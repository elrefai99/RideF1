name: Go CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/api/go.mod
          cache: true

      - name: Test
        working-directory: app/api
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/api/go.mod
          cache: true

      - name: Download dependencies
        working-directory: app/api
        run: go mod download

      - name: Build
        working-directory: app/api
        run: go build ./...

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
