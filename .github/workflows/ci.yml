name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  # MCP
  check-mcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: MCP/pnpm-lock.yaml

      - name: Install MCP dependencies
        working-directory: MCP
        run: pnpm install --frozen-lockfile

      - name: TypeScript compile check
        working-directory: MCP
        run: pnpm exec tsc --noEmit --project tsconfig.json
  test-mcp:
    runs-on: ubuntu-latest
    needs: check-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: MCP/pnpm-lock.yaml

      - name: Install dependencies & devDependencies
        working-directory: MCP
        run: pnpm install --frozen-lockfile

      - name: Run Vitest test
        working-directory: MCP
        run: pnpm test

  build-mcp:
    runs-on: ubuntu-latest
    needs: test-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: MCP/pnpm-lock.yaml

      - name: Install dependencies & devDependencies
        working-directory: MCP
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript build
        working-directory: MCP
        run: pnpm build

  # GO
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/api/go.mod
          cache: true

      - name: Test
        working-directory: app/api
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/api/go.mod
          cache: true

      - name: Download dependencies
        working-directory: app/api
        run: go mod download

      - name: Build
        working-directory: app/api
        run: go build ./...

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
