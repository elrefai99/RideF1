version: "3.8"
service:
  postgresql:
    image: postgres:17
  container_name: postgresql_container
  ports:
    - "5432:5432"
  environment:
    POSTGRES_USER: ridef1
    POSTGRES_PASSWORD: ridef12026
    POSTGRES_DB: ridef1
  volumes:
    - postgresql_data:/data/postgresql
  restart: always

volumes:
  postgres_data:
